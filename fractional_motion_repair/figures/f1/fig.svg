    <g fill="#596771">
      <circle cx="283.5" cy="58" r="1.35"/><circle cx="289.5" cy="58" r="1.35"/>
      <circle cx="295.5" cy="58" r="1.35"/><circle cx="301.5" cy="58" r="1.35"/>
      <circle cx="307.5" cy="58" r="1.35"/><circle cx="313.5" cy="58" r="1.35"/>
      <circle cx="295.5" cy="49" r="1.45"/><circle cx="307.5" cy="49" r="1.45"/>
      <circle cx="301.5" cy="39" r="1.6"/>
    </g>
    <text x="298.5" y="82.5" text-anchor="middle">Long-gap TCN</text>
  </g>

  <g id="n:output-endpoint-projection" data-kind="node">
    <rect x="333" y="15" width="65" height="78" rx="3" fill="#e3f0ee" stroke="#7daaa8" stroke-width="0.64"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M342 56 H389 M347 36 V64 M384 36 V64" stroke="#96b4b2" stroke-width="0.55"/>
      <path d="M347 45 C353 41.51 357 32.19 363 33.70 C369 35.22 373 47.89 378 45.49 C380.5 44.78 382 43.46 384 42"
            stroke="#687780" stroke-width="0.82" stroke-dasharray="2 2"/>
      <path d="M347 56 C353 53 357 44 363 46 C369 48 373 61 378 59 C380.5 58.5 382 57.3 384 56"
            stroke="#216d72" stroke-width="1.32"/>
    </g>
    <circle cx="347" cy="56" r="1.55" fill="#216d72"/>
    <circle cx="384" cy="56" r="1.55" fill="#216d72"/>
    <text x="365.5" y="77.5" text-anchor="middle" font-weight="bold" fill="#134e53">Output endpoint</text>
    <text x="365.5" y="85.6" text-anchor="middle" font-weight="bold" fill="#134e53">projection</text>
  </g>

  <g id="n:short-gap-tcn" data-kind="node">
    <rect x="266" y="108" width="65" height="27" rx="3" fill="#f3f5f6" stroke="#d2d9dd" stroke-width="0.55"/>
    <g fill="none" stroke="#6c7680" stroke-width="0.65" stroke-linecap="round">
      <path d="M290.5 121 L294.5 113 L298.5 121 M294.5 113 L306.5 121 M298.5 121 L302.5 113 L306.5 121"/>
    </g>
    <g fill="#596771">
      <circle cx="290.5" cy="121" r="1.25"/><circle cx="298.5" cy="121" r="1.25"/><circle cx="306.5" cy="121" r="1.25"/>
      <circle cx="294.5" cy="113" r="1.35"/><circle cx="302.5" cy="113" r="1.35"/>
    </g>
    <text x="298.5" y="130.3" text-anchor="middle">Short-gap TCN</text>
  </g>

  <g id="n:duration-routing" data-kind="node">
