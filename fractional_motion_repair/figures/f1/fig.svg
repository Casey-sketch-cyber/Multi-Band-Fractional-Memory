    </g>
    <circle cx="217.5" cy="58" r="1.55" fill="#52626e"/>
    <circle cx="251.5" cy="58" r="1.55" fill="#52626e"/>
    <text x="234.5" y="77.5" text-anchor="middle">Input endpoint</text>
    <text x="234.5" y="85.6" text-anchor="middle">bridge</text>
  </g>

