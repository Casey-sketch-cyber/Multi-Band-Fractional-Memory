    </g>
    <text x="164" y="77.5" text-anchor="middle" font-weight="bold" fill="#134e53">Tempered</text>
    <text x="164" y="85.6" text-anchor="middle" font-weight="bold" fill="#134e53">kernel bands</text>
  </g>

