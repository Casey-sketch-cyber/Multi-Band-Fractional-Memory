    <rect x="274" y="15" width="49" height="78" rx="3" fill="#f3f5f6" stroke="#d2d9dd" stroke-width="0.55"/>
    <g fill="none" stroke="#6c7680" stroke-width="0.59" stroke-linecap="round" stroke-linejoin="round">
      <path d="M283.5 58 L295.5 49 M289.5 58 L295.5 49 M295.5 58 L295.5 49
               M295.5 58 L307.5 49 M301.5 58 L307.5 49 M313.5 58 L307.5 49
