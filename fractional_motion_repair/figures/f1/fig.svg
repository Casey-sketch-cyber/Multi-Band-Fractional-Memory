      <circle cx="33.8" cy="32.9" r="2.15" fill="#edf0f1"/>
      <path d="M33.8 35.1 L33.5 38.9 L34.3 49.7 M29.8 39.4 L37.3 38.6
               M29.8 39.4 L27.9 44.2 L29.4 48.3 M37.3 38.6 L41.1 37.2 L42.7 32.8
               M31.2 49.9 L37.4 49.6 M31.2 49.9 L29.7 55.3 L26.6 60.2 L28.2 61.2
               M37.4 49.6 L39.6 55.9 L39.5 62.5 L41.3 62.8"/>
      <circle cx="53.2" cy="33.5" r="2.15" fill="#ffffff"/>
      <path d="M53.1 35.8 L52.4 39.4 L51.2 49.8 M48.7 38.8 L56.4 39.6
               M48.7 38.8 L46.5 44.1 L44.8 43 M56.4 39.6 L59 35.1 L60.9 32.2
               M48.4 49.7 L54.6 49.9 M48.4 49.7 L46.4 55.1 L47 61.5 L48.9 62
               M54.6 49.9 L57.6 54.7 L59.1 60.9 L60.9 61.5"/>
    </g>
    <path d="M466 68 H475 M485 68 H494 M504 68 H513" fill="none" stroke="#a3adb4"
          stroke-width="0.65" stroke-linecap="round"/>
    <text x="489" y="82.5" text-anchor="middle">Completed poses</text>
  </g>

  <g fill="none" stroke="#56636d" stroke-width="0.8" stroke-linejoin="round">
    <g id="e:observed-to-linear" data-from="masked-poses" data-to="linear-interpolation"><path d="M63 51 H71" marker-end="url(#main-arrow)"/></g>
    <g id="e:linear-to-bands" data-from="linear-interpolation" data-to="tempered-kernel-bands"><path d="M124 51 H132" marker-end="url(#main-arrow)"/></g>
    <g id="e:bands-to-bridge" data-from="tempered-kernel-bands" data-to="input-endpoint-bridge"><path d="M196 51 H204" marker-end="url(#main-arrow)"/></g>
    <g id="e:bridge-to-long" data-from="input-endpoint-bridge" data-to="long-gap-tcn"><path d="M265 51 H273" marker-end="url(#main-arrow)"/></g>
    <g id="e:long-to-projection" data-from="long-gap-tcn" data-to="output-endpoint-projection"><path d="M324 51 H332" marker-end="url(#main-arrow)"/></g>
    <g id="e:projection-to-router" data-from="output-endpoint-projection" data-to="duration-routing"><path d="M399 51 H407" marker-end="url(#main-arrow)"/></g>
    <g id="e:router-to-completed" data-from="duration-routing" data-to="completed-poses"><path d="M451 51 H459" marker-end="url(#main-arrow)"/></g>
