<svg xmlns="http://www.w3.org/2000/svg" width="523.559pt" height="150pt" viewBox="0 0 523.559 150"
     font-family="Arimo, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="6.5"
     data-spec="ecb-tgl-fig1" data-spec-version="1" fill="#27333d">
  <title>Endpoint-constrained kernel bridge for skeletal motion imputation</title>
  <desc>A masked pose sequence is linearly interpolated. Parallel temporal convolutional experts join at a duration router. The long-gap expert uses tempered kernel bands and endpoint constraints.</desc>
  <defs>
    <marker id="main-arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5"
            refX="4.6" refY="2.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L5 2.5 L0 5 Z" fill="#56636d"/>
    </marker>
    <marker id="branch-arrow" viewBox="0 0 5 5" markerWidth="4" markerHeight="4"
            refX="4.6" refY="2.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L5 2.5 L0 5 Z" fill="#6c7680"/>
    </marker>
  </defs>

  <g id="n:masked-poses" data-kind="node">
    <rect x="4" y="15" width="58" height="78" rx="3" fill="#ffffff"/>
    <rect x="24" y="25" width="19" height="45" rx="2.1" fill="#edf0f1"/>
    <g fill="none" stroke="#485660" stroke-width="0.94" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="14.1" cy="33.3" r="2.15" fill="#ffffff"/>
