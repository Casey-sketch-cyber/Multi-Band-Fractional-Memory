    <circle cx="86" cy="53" r="1.45" fill="#3c4954"/>
    <circle cx="109" cy="40" r="1.45" fill="#3c4954"/>
    <text x="97.5" y="77.5" text-anchor="middle">Linear</text>
    <text x="97.5" y="85.6" text-anchor="middle">interpolation</text>
  </g>

  <g id="n:tempered-kernel-bands" data-kind="node">
    <rect x="133" y="15" width="62" height="78" rx="3" fill="#e3f0ee" stroke="#7daaa8" stroke-width="0.64"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M143 36 H185 M143 51 H185 M143 66 H185" stroke="#9ab8b6" stroke-width="0.55"/>
      <path d="M146 36 V25 M151.5 36 V31.2 M157 36 V33.5 M162.5 36 V34.9 M168 36 V35.5 M173.5 36 V35.7 M179 36 V35.8 M184.5 36 V35.9"
