               M17.1 50.1 L19.5 55 L18.8 60.5 L21.2 61.5"/>
      <circle cx="33.8" cy="32.9" r="2.15" fill="#edf0f1"/>
      <path d="M33.8 35.1 L33.5 38.9 L34.3 49.7 M29.8 39.4 L37.3 38.6
               M29.8 39.4 L27.9 44.2 L29.4 48.3
               M31.2 49.9 L37.4 49.6 M31.2 49.9 L29.7 55.3 L26.6 60.2 L28.2 61.2
               M37.4 49.6 L39.6 55.9 L39.5 62.5 L41.3 62.8"/>
      <circle cx="53.2" cy="33.5" r="2.15" fill="#ffffff"/>
      <path d="M53.1 35.8 L52.4 39.4 L51.2 49.8 M48.7 38.8 L56.4 39.6
               M48.7 38.8 L46.5 44.1 L44.8 43 M56.4 39.6 L59 35.1 L60.9 32.2
               M48.4 49.7 L54.6 49.9 M48.4 49.7 L46.4 55.1 L47 61.5 L48.9 62
               M54.6 49.9 L57.6 54.7 L59.1 60.9 L60.9 61.5"/>
    </g>
    <path d="M10 68 H19 M29 68 H38 M48 68 H57" fill="none" stroke="#a3adb4"
          stroke-width="0.65" stroke-linecap="round"/>
    <text x="33" y="82.5" text-anchor="middle">Masked poses</text>
  </g>

  <g id="n:linear-interpolation" data-kind="node">
    <rect x="72" y="15" width="51" height="78" rx="3" fill="#f3f5f6" stroke="#d2d9dd" stroke-width="0.55"/>
    <rect x="86" y="34" width="23" height="29" rx="1.2" fill="#e6eaed"/>
    <g fill="none" stroke-width="0.84" stroke-linecap="round" stroke-linejoin="round">
      <path d="M79 58 L82 54 L86 53 M109 40 L113 37 L116 38" stroke="#66747f"/>
      <path d="M86 53 L109 40" stroke="#3c4954"/>
